name: Build Rawalworld Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RAWALWORLD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RAWALWORLD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RAWALWORLD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RAWALWORLD_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || { echo "Missing RAWALWORLD_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing RAWALWORLD_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing RAWALWORLD_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing RAWALWORLD_KEY_PASSWORD"; exit 1; }

      - name: Prepare Rawalworld final source
        shell: bash
        run: |
          set -e
          rm -f app/src/main/java/com/astrolife/app/MainActivity.kt
          rm -f app/src/main/java/com/astrolife/app/MainActivityV2.kt
          rm -f app/src/main/java/com/astrolife/app/RawalworldActivity.kt
          cp .github/assets/MainActivity.final.kt app/src/main/java/com/astrolife/app/MainActivity.kt

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/rawalworld_ganeshji_final.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7D2D1F" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F4C66A" android:pathData="M54,14a40,40 0,1 0,0 80a40,40 0,1 0,0 -80"/>
              <path android:fillColor="#7D2D1F" android:pathData="M53,27c-12,0 -22,9 -22,21c0,9 5,15 12,19c-2,7 -1,13 3,17c4,4 10,5 15,2c6,-3 9,-9 8,-15c-1,-5 -4,-9 -9,-11c6,-3 10,-9 10,-16c0,-10 -7,-17 -17,-17zM48,40c4,-5 12,-4 15,1c3,6 0,12 -6,14c-4,1 -7,5 -6,9c1,5 6,7 10,5c2,-1 4,-3 5,-5c2,6 -1,13 -7,16c-6,3 -13,0 -15,-6c-2,-5 0,-10 4,-14c-7,-2 -12,-7 -12,-14c0,-7 5,-13 12,-15z"/>
          </vector>
          XML

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path('app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(path)
          root=tree.getroot()
          app=root.find('application')
          app.set('{%s}label'%ns,'Rawalworld')
          app.set('{%s}icon'%ns,'@drawable/rawalworld_ganeshji_final')
          app.set('{%s}roundIcon'%ns,'@drawable/rawalworld_ganeshji_final')
          for a in list(app.findall('activity')):
              app.remove(a)
          act=ET.SubElement(app,'activity')
          act.set('{%s}name'%ns,'.MainActivity')
          act.set('{%s}exported'%ns,'true')
          f=ET.SubElement(act,'intent-filter')
          ET.SubElement(f,'action').set('{%s}name'%ns,'android.intent.action.MAIN')
          ET.SubElement(f,'category').set('{%s}name'%ns,'android.intent.category.LAUNCHER')
          tree.write(path,encoding='utf-8',xml_declaration=True)
          PY

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RAWALWORLD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rawalworld-release.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release AAB
        shell: bash
        env:
          RAWALWORLD_KEYSTORE_PATH: ${{ runner.temp }}/rawalworld-release.jks
          RAWALWORLD_STORE_PASSWORD: ${{ secrets.RAWALWORLD_STORE_PASSWORD }}
          RAWALWORLD_KEY_ALIAS: ${{ secrets.RAWALWORLD_KEY_ALIAS }}
          RAWALWORLD_KEY_PASSWORD: ${{ secrets.RAWALWORLD_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rawalworld-Play-Store-AAB
          path: app/build/outputs/bundle/release/app-release.aab
