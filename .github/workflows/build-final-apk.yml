name: Build Final Rawalworld APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/assets/MainActivity.v2.kt'
      - '.github/assets/fix_service_contacts_v2.py'
      - '.github/assets/fix_admin_dashboard_v2.py'
      - '.github/assets/rawalworld_logo.b64'
      - '.github/workflows/build-final-apk.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Rawalworld V2 source and safe launcher
        shell: bash
        run: |
          rm -f app/src/main/java/com/astrolife/app/MainActivity.kt
          rm -f app/src/main/java/com/astrolife/app/RawalworldActivity.kt
          rm -f app/src/main/java/com/astrolife/app/MainActivityV2.kt
          cp .github/assets/MainActivity.v2.kt app/src/main/java/com/astrolife/app/MainActivityV2.kt
          python3 .github/assets/fix_service_contacts_v2.py
          python3 .github/assets/fix_admin_dashboard_v2.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/astrolife/app/MainActivityV2.kt')
          s=p.read_text(encoding='utf-8')
          old='Image(painterResource(R.drawable.rawalworld_logo),"Rawalworld",Modifier.size(76.dp),contentScale=ContentScale.Crop);Spacer(Modifier.width(12.dp));'
          new='Text("🕉️",style=MaterialTheme.typography.displayMedium);Spacer(Modifier.width(12.dp));'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path('app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(path)
          root=tree.getroot()
          app=root.find('application')
          app.set('{%s}label'%ns,'Rawalworld')
          app.attrib.pop('{%s}icon'%ns, None)
          app.attrib.pop('{%s}roundIcon'%ns, None)
          for a in list(app.findall('activity')):
              app.remove(a)
          act=ET.SubElement(app,'activity')
          act.set('{%s}name'%ns,'.MainActivityV2')
          act.set('{%s}exported'%ns,'true')
          f=ET.SubElement(act,'intent-filter')
          ET.SubElement(f,'action').set('{%s}name'%ns,'android.intent.action.MAIN')
          ET.SubElement(f,'category').set('{%s}name'%ns,'android.intent.category.LAUNCHER')
          tree.write(path,encoding='utf-8',xml_declaration=True)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        id: apkbuild
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee /tmp/rawalworld-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Rawalworld APK compiler errors"
              echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              grep -nE '(^| )e: |error:|FAILURE:|Compilation error|Unresolved reference|Type mismatch|No value passed|Cannot find|Expecting ' /tmp/rawalworld-build.log || true
              echo
              echo "--- Tail ---"
              tail -n 80 /tmp/rawalworld-build.log
            } > .github/last-build-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-build-error.txt
            git commit -m "Save latest Rawalworld build error" || true
            git push || true
            exit "$status"
          fi

      - name: Upload Rawalworld APK
        uses: actions/upload-artifact@v4
        with:
          name: Rawalworld-Final-APK
          path: app/build/outputs/apk/debug/app-debug.apk
