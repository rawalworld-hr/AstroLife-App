name: Build Final Rawalworld APK
# Trigger rebuild after donation compile fix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/assets/MainActivity.final.kt'
      - '.github/scripts/sync_v120.py'
      - '.github/scripts/fix_v120_compile.py'
      - '.github/workflows/build-final-apk.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare final Rawalworld APK source
        shell: bash
        run: |
          set -e
          rm -f app/src/main/java/com/astrolife/app/MainActivity.kt app/src/main/java/com/astrolife/app/MainActivityV2.kt app/src/main/java/com/astrolife/app/RawalworldActivity.kt
          cp .github/assets/MainActivity.final.kt app/src/main/java/com/astrolife/app/MainActivity.kt

          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('app/src/main/java/com/astrolife/app/MainActivity.kt')
          s=p.read_text()

          s=s.replace('@Composable fun AdminScreen(){val context=LocalContext.current;var auth by remember{mutableStateOf(token(context))};if(auth.isBlank())AdminLogin(context){auth=it}else AdminDashboard(context,auth){saveToken(context,"");auth=""}}',
                      '@Composable fun AdminScreen(){val context=LocalContext.current;var auth by remember{mutableStateOf("")};if(auth.isBlank())AdminLogin(context){auth=it}else AdminDashboard(context,auth){saveToken(context,"");auth=""}}',1)

          old='var pd by remember{mutableStateOf("")};var photoUri by remember{mutableStateOf<Uri?>(null)};'
          new='var pd by remember{mutableStateOf("")};var masterType by remember{mutableStateOf("shop")};var masterName by remember{mutableStateOf("")};var photoUri by remember{mutableStateOf<Uri?>(null)};'
          if old not in s: raise SystemExit('Admin state marker missing')
          s=s.replace(old,new,1)

          marker='};Section("MASTER EDIT / DELETE"){'
          create=r'''};Section("CREATE MASTER"){
            var typeMenu by remember{mutableStateOf(false)}
            Box{OutlinedButton(onClick={typeMenu=true},Modifier.fillMaxWidth()){Text("Master type: $masterType")};DropdownMenu(typeMenu,{typeMenu=false}){listOf("shop","service","entertainment","travel","astrology").forEach{t->DropdownMenuItem(text={Text(t)},onClick={masterType=t;typeMenu=false})}}}
            OutlinedTextField(masterName,{masterName=it},label={Text("Master name")},modifier=Modifier.fillMaxWidth())
            Button(onClick={if(masterName.isBlank()){msg="Enter master name."}else Thread{val ok=try{write("masters","POST",JSONObject().put("master_type",masterType).put("name",masterName.trim()).put("is_active",true),auth)}catch(_:Exception){false};ui{msg=if(ok)"✅ Master created." else "Master creation failed — please log out and login again.";if(ok){masterName="";reload()}}}.start()},Modifier.fillMaxWidth()){Text("Add Master")}
          };Section("MASTER EDIT / DELETE"){'''
          if marker not in s: raise SystemExit('Master section marker missing')
          s=s.replace(marker,create,1)

          p.write_text(s)
          PY

          python3 .github/scripts/sync_v120.py
          python3 .github/scripts/fix_v120_compile.py

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/rawalworld_ganeshji_final.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#24104F" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#F6C95C" android:pathData="M54,12a42,42 0,1 0,0 84a42,42 0,1 0,0 -84"/>
            <path android:fillColor="#9A3412" android:pathData="M54,25c-13,0 -23,10 -23,22c0,8 4,15 11,19c-2,7 0,14 5,18c5,4 12,4 17,1c7,-4 10,-12 7,-19c-1,-4 -4,-7 -8,-9c6,-4 9,-10 8,-17c-1,-9 -8,-15 -17,-15zM48,39c5,-5 13,-4 16,2c3,6 0,12 -6,14c-5,2 -8,6 -6,11c1,5 7,7 11,4c2,-1 4,-3 5,-6c2,7 -1,14 -8,17c-7,3 -14,-1 -16,-8c-1,-5 1,-10 5,-13c-8,-2 -13,-8 -13,-15c0,-7 5,-13 12,-16z"/>
          </vector>
          XML

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path('app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(path)
          root=tree.getroot()
          app=root.find('application')
          app.set('{%s}label'%ns,'Rawalworld')
          app.set('{%s}icon'%ns,'@drawable/rawalworld_ganeshji_final')
          app.set('{%s}roundIcon'%ns,'@drawable/rawalworld_ganeshji_final')
          for a in list(app.findall('activity')): app.remove(a)
          act=ET.SubElement(app,'activity')
          act.set('{%s}name'%ns,'.MainActivity')
          act.set('{%s}exported'%ns,'true')
          f=ET.SubElement(act,'intent-filter')
          ET.SubElement(f,'action').set('{%s}name'%ns,'android.intent.action.MAIN')
          ET.SubElement(f,'category').set('{%s}name'%ns,'android.intent.category.LAUNCHER')
          tree.write(path,encoding='utf-8',xml_declaration=True)
          PY

          grep -q 'Share Product' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'Create / Update Customer Account' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'Donation for Needy People' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'Enter a valid future date' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'Shop category wise' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'CREATE MASTER' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'PAYMENT MASTER' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'PRODUCT EDIT / DELETE / ACTIVE-INACTIVE' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'CLIENT RECORDS' app/src/main/java/com/astrolife/app/MainActivity.kt
          echo 'Rawalworld v1.2 final APK source verified.'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee /tmp/rawalworld-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Rawalworld APK compiler errors"
              grep -nE '(^| )e: |error:|FAILURE:|Compilation error|Unresolved reference|Type mismatch|No value passed|Cannot find|Expecting ' /tmp/rawalworld-build.log || true
              tail -n 160 /tmp/rawalworld-build.log
            } > .github/last-build-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-build-error.txt
            git commit -m "Save latest Rawalworld build error" || true
            git push || true
            exit "$status"
          fi

      - name: Upload Rawalworld APK
        uses: actions/upload-artifact@v4
        with:
          name: Rawalworld-Final-APK-v1.2.0
          path: app/build/outputs/apk/debug/app-debug.apk