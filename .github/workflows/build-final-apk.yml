name: Build Final Rawalworld APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/assets/MainActivity.final.kt'
      - '.github/assets/rawalworld_logo.b64'
      - '.github/workflows/build-final-apk.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare single final Rawalworld source
        shell: bash
        run: |
          set -e
          rm -f app/src/main/java/com/astrolife/app/MainActivity.kt
          rm -f app/src/main/java/com/astrolife/app/MainActivityV2.kt
          rm -f app/src/main/java/com/astrolife/app/RawalworldActivity.kt
          cp .github/assets/MainActivity.final.kt app/src/main/java/com/astrolife/app/MainActivity.kt

          python3 - <<'PY'
          import re
          from pathlib import Path

          path=Path('app/src/main/java/com/astrolife/app/MainActivity.kt')
          s=path.read_text()

          home='''@Composable fun HomeScreen(open:(ServiceItem)->Unit){
            var language by remember{mutableStateOf("English")}
            var langMenu by remember{mutableStateOf(false)}
            fun localTitle(t:String)=when(language){
              "Gujarati"->mapOf("Astrology" to "જ્યોતિષ","Events" to "ઇવેન્ટ્સ","Decoration" to "ડેકોરેશન","Catering" to "કેટરિંગ","Consultancy" to "કન્સલ્ટન્સી","Tours & Travel" to "ટૂર્સ અને ટ્રાવેલ","Map" to "નકશો","Gujarat News" to "ગુજરાત સમાચાર","Weather Update" to "હવામાન","Entertainment" to "મનોરંજન")[t]?:t
              "Hindi"->mapOf("Astrology" to "ज्योतिष","Events" to "कार्यक्रम","Decoration" to "सजावट","Catering" to "कैटरिंग","Consultancy" to "परामर्श","Tours & Travel" to "टूर्स और ट्रैवल","Map" to "मैप","Gujarat News" to "गुजरात समाचार","Weather Update" to "मौसम","Entertainment" to "मनोरंजन")[t]?:t
              "French"->mapOf("Astrology" to "Astrologie","Events" to "Événements","Decoration" to "Décoration","Catering" to "Traiteur","Consultancy" to "Conseil","Tours & Travel" to "Tours & Voyages","Map" to "Carte","Gujarat News" to "Actualités du Gujarat","Weather Update" to "Météo","Entertainment" to "Divertissement")[t]?:t
              else->t
            }
            val heroTitle=when(language){"Gujarati"->"તમારી દરેક જરૂરિયાત, એક જ એપમાં.";"Hindi"->"आपकी हर ज़रूरत, एक ही ऐप में।";"French"->"Tout ce dont vous avez besoin, dans une seule application.";else->"Everything you need, in one app."}
            val heroSub=when(language){"Gujarati"->"જ્યોતિષ • પ્રવાસ • નકશો • સમાચાર • હવામાન • ક્રિકેટ • ગીતો • શોપિંગ";"Hindi"->"ज्योतिष • यात्रा • मैप • समाचार • मौसम • क्रिकेट • गाने • शॉपिंग";"French"->"Astrologie • Voyage • Carte • Actualités • Météo • Cricket • Musique • Shopping";else->"Astrology • Travel • Maps • News • Weather • Cricket • Songs • Shopping"}
            Column(Modifier.fillMaxSize().padding(16.dp).verticalScroll(rememberScrollState())){
              Row(Modifier.fillMaxWidth(),verticalAlignment=Alignment.CenterVertically){
                Image(painterResource(R.drawable.rawalworld_ganeshji_final),"Ganeshji Rawalworld",Modifier.size(82.dp),contentScale=ContentScale.Fit)
                Spacer(Modifier.width(12.dp))
                Column(Modifier.weight(1f)){Text("Rawalworld",style=MaterialTheme.typography.headlineMedium,fontWeight=FontWeight.ExtraBold);Text("Everything in one app")}
                Box{OutlinedButton(onClick={langMenu=true}){Text("🌐 $language")};DropdownMenu(expanded=langMenu,onDismissRequest={langMenu=false}){listOf("English","Gujarati","Hindi","French").forEach{l->DropdownMenuItem(text={Text(l)},onClick={language=l;langMenu=false})}}}
              }
              Spacer(Modifier.height(12.dp))
              Card(colors=CardDefaults.cardColors(containerColor=Purple),modifier=Modifier.fillMaxWidth()){
                Column(Modifier.padding(18.dp)){Text(heroTitle,color=Color.White,style=MaterialTheme.typography.headlineSmall,fontWeight=FontWeight.Bold);Text(heroSub,color=Color.White)}
              }
              Spacer(Modifier.height(12.dp))
              Text(if(language=="Gujarati")"સેવાઓ" else if(language=="Hindi")"सेवाएँ" else if(language=="French")"Services" else "Explore services",fontWeight=FontWeight.ExtraBold)
              publicServices.forEach{s->Card(onClick={open(s)},Modifier.fillMaxWidth().padding(vertical=5.dp)){Row(Modifier.fillMaxWidth().padding(16.dp),verticalAlignment=Alignment.CenterVertically){Text(s.icon,style=MaterialTheme.typography.headlineMedium);Spacer(Modifier.width(12.dp));Text(localTitle(s.title),Modifier.weight(1f),fontWeight=FontWeight.Bold);Text("Open ›",color=Purple)}}}
              Card(onClick={open(ServiceItem("🛍️","Online Shopping",emptyList()))},Modifier.fillMaxWidth().padding(vertical=5.dp)){Row(Modifier.fillMaxWidth().padding(16.dp),verticalAlignment=Alignment.CenterVertically){Text("🛍️",style=MaterialTheme.typography.headlineMedium);Spacer(Modifier.width(12.dp));Text(if(language=="Gujarati")"ઓનલાઇન શોપિંગ" else if(language=="Hindi")"ऑनलाइन शॉपिंग" else if(language=="French")"Shopping en ligne" else "Online Shopping",Modifier.weight(1f),fontWeight=FontWeight.Bold);Text("Open ›",color=Purple)}}
              Text("📞 +91 77093 78969   ✉ rawalworld@gmail.com",Modifier.padding(top=16.dp),style=MaterialTheme.typography.bodySmall)
            }
          }'''
          s,n=re.subn(r'@Composable fun HomeScreen\(open:\(ServiceItem\)->Unit\)\{.*?\n\n@Composable fun ServiceScreen',home+'\n\n@Composable fun ServiceScreen',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('HomeScreen replacement failed')

          shop='''@Composable fun ShopScreen(){
            val context=LocalContext.current
            var products by remember{mutableStateOf<List<ProductRow>>(emptyList())}
            var loading by remember{mutableStateOf(true)}
            var selected by remember{mutableStateOf<ProductRow?>(null)}
            var category by remember{mutableStateOf("All")}
            LaunchedEffect(Unit){Thread{val out=mutableListOf<ProductRow>();try{val a=getArray("products?select=id,name,category,description,price,is_active,image_url&is_active=eq.true&order=created_at.desc");for(i in 0 until a.length()){val x=a.getJSONObject(i);out+=ProductRow(x.optString("id"),x.optString("name"),x.optString("category"),x.optString("description"),x.optDouble("price"),true,x.optString("image_url"))}}catch(_:Exception){};ui{products=out;loading=false}}.start()}
            val categories=listOf("All")+products.map{it.category.ifBlank{"Other"}}.distinct()
            val visible=if(category=="All")products else products.filter{it.category==category}
            Column(Modifier.fillMaxSize().padding(16.dp).verticalScroll(rememberScrollState())){
              Text("🛍️ Online Shopping",style=MaterialTheme.typography.headlineMedium,fontWeight=FontWeight.Bold)
              Text("Shop category wise",color=Purple,fontWeight=FontWeight.Bold)
              Spacer(Modifier.height(8.dp))
              categories.forEach{cat->OutlinedButton(onClick={category=cat},Modifier.fillMaxWidth().padding(vertical=2.dp)){Text((if(category==cat)"✓ " else "")+cat)}}
              Spacer(Modifier.height(8.dp))
              if(loading)CircularProgressIndicator(Modifier.padding(16.dp))
              if(!loading&&visible.isEmpty())Text("No active products found in this category.")
              visible.forEach{p->Card(Modifier.fillMaxWidth().padding(vertical=6.dp)){Column(Modifier.padding(14.dp)){if(p.imageUrl.isNotBlank())RemoteImage(p.imageUrl);Text(p.name,fontWeight=FontWeight.Bold);Text(p.category,style=MaterialTheme.typography.bodySmall);if(p.description.isNotBlank())Text(p.description);Text("₹ ${String.format("%.2f",p.price)}",fontWeight=FontWeight.Bold);Button(onClick={selected=p},Modifier.fillMaxWidth().padding(top=8.dp)){Text("Buy Now")}}}}
            }
            selected?.let{CheckoutDialog(context,it){selected=null}}
          }'''
          s,n=re.subn(r'@Composable fun ShopScreen\(\)\{.*?\n\n@Composable fun CheckoutDialog',shop+'\n\n@Composable fun CheckoutDialog',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ShopScreen replacement failed')

          s,n=re.subn(r'var pd by remember\{mutableStateOf\(""\)\};var photoUri', 'var pd by remember{mutableStateOf("")};var newMasterType by remember{mutableStateOf("shop")};var newMasterName by remember{mutableStateOf("")};var photoUri', s, count=1)
          if n!=1: raise SystemExit('Admin master state injection failed')

          marker='};Section("MASTER EDIT / DELETE"){'
          create='''};Section("CREATE MASTER"){
            OutlinedTextField(newMasterType,{newMasterType=it},label={Text("Master type: shop / service / entertainment / travel / astrology")},modifier=Modifier.fillMaxWidth())
            OutlinedTextField(newMasterName,{newMasterName=it},label={Text("Master name")},modifier=Modifier.fillMaxWidth())
            Button(onClick={if(newMasterName.isBlank()){msg="Enter master name."}else Thread{val ok=try{write("masters","POST",JSONObject().put("master_type",newMasterType.trim().ifBlank{"shop"}).put("name",newMasterName.trim()).put("is_active",true),auth)}catch(_:Exception){false};ui{msg=if(ok)"✅ Master created." else "Master creation failed.";if(ok){newMasterName="";reload()}}}.start()},Modifier.fillMaxWidth()){Text("Add Master")}
          };Section("MASTER EDIT / DELETE"){'''
          if marker not in s: raise SystemExit('Master section marker missing')
          s=s.replace(marker,create,1)

          path.write_text(s)
          PY

          mkdir -p app/src/main/res/drawable
          base64 -d .github/assets/rawalworld_logo.b64 > app/src/main/res/drawable/rawalworld_ganeshji_final.jpg

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path('app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(path)
          root=tree.getroot()
          app=root.find('application')
          app.set('{%s}label'%ns,'Rawalworld')
          app.set('{%s}icon'%ns,'@drawable/rawalworld_ganeshji_final')
          app.set('{%s}roundIcon'%ns,'@drawable/rawalworld_ganeshji_final')
          for a in list(app.findall('activity')):
              app.remove(a)
          act=ET.SubElement(app,'activity')
          act.set('{%s}name'%ns,'.MainActivity')
          act.set('{%s}exported'%ns,'true')
          f=ET.SubElement(act,'intent-filter')
          ET.SubElement(f,'action').set('{%s}name'%ns,'android.intent.action.MAIN')
          ET.SubElement(f,'category').set('{%s}name'%ns,'android.intent.category.LAUNCHER')
          tree.write(path,encoding='utf-8',xml_declaration=True)
          PY

          grep -q '🌐' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'Shop category wise' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'CREATE MASTER' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'PAYMENT MASTER' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'PRODUCT EDIT / DELETE / ACTIVE-INACTIVE' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'CLIENT RECORDS' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'Continue to Payment' app/src/main/java/com/astrolife/app/MainActivity.kt
          echo 'Final Rawalworld features verified.'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee /tmp/rawalworld-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Rawalworld APK compiler errors"
              echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              grep -nE '(^| )e: |error:|FAILURE:|Compilation error|Unresolved reference|Type mismatch|No value passed|Cannot find|Expecting ' /tmp/rawalworld-build.log || true
              echo
              tail -n 100 /tmp/rawalworld-build.log
            } > .github/last-build-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-build-error.txt
            git commit -m "Save latest Rawalworld build error" || true
            git push || true
            exit "$status"
          fi

      - name: Upload Rawalworld APK
        uses: actions/upload-artifact@v4
        with:
          name: Rawalworld-Final-APK
          path: app/build/outputs/apk/debug/app-debug.apk
