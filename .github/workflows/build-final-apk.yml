name: Build Final Rawalworld APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/assets/MainActivity.final.kt'
      - '.github/workflows/build-final-apk.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare single final Rawalworld source
        shell: bash
        run: |
          set -e
          rm -f app/src/main/java/com/astrolife/app/MainActivity.kt
          rm -f app/src/main/java/com/astrolife/app/MainActivityV2.kt
          rm -f app/src/main/java/com/astrolife/app/RawalworldActivity.kt
          cp .github/assets/MainActivity.final.kt app/src/main/java/com/astrolife/app/MainActivity.kt

          # Use an Android XML/vector launcher resource instead of decoding a fragile base64 image.
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/rawalworld_ganeshji_final.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#7D2D1F" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F4C66A" android:pathData="M54,14a40,40 0,1 0,0 80a40,40 0,1 0,0 -80"/>
              <path android:fillColor="#7D2D1F" android:pathData="M53,27c-12,0 -22,9 -22,21c0,9 5,15 12,19c-2,7 -1,13 3,17c4,4 10,5 15,2c6,-3 9,-9 8,-15c-1,-5 -4,-9 -9,-11c6,-3 10,-9 10,-16c0,-10 -7,-17 -17,-17zM48,40c4,-5 12,-4 15,1c3,6 0,12 -6,14c-4,1 -7,5 -6,9c1,5 6,7 10,5c2,-1 4,-3 5,-5c2,6 -1,13 -7,16c-6,3 -13,0 -15,-6c-2,-5 0,-10 4,-14c-7,-2 -12,-7 -12,-14c0,-7 5,-13 12,-15z"/>
          </vector>
          XML

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path('app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(path)
          root=tree.getroot()
          app=root.find('application')
          app.set('{%s}label'%ns,'Rawalworld')
          app.set('{%s}icon'%ns,'@drawable/rawalworld_ganeshji_final')
          app.set('{%s}roundIcon'%ns,'@drawable/rawalworld_ganeshji_final')
          for a in list(app.findall('activity')):
              app.remove(a)
          act=ET.SubElement(app,'activity')
          act.set('{%s}name'%ns,'.MainActivity')
          act.set('{%s}exported'%ns,'true')
          f=ET.SubElement(act,'intent-filter')
          ET.SubElement(f,'action').set('{%s}name'%ns,'android.intent.action.MAIN')
          ET.SubElement(f,'category').set('{%s}name'%ns,'android.intent.category.LAUNCHER')
          tree.write(path,encoding='utf-8',xml_declaration=True)
          PY

          grep -q 'PAYMENT MASTER' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'PRODUCT EDIT / DELETE / ACTIVE-INACTIVE' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'MASTER EDIT / DELETE' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'CLIENT RECORDS' app/src/main/java/com/astrolife/app/MainActivity.kt
          grep -q 'Continue to Payment' app/src/main/java/com/astrolife/app/MainActivity.kt
          echo 'Single final Rawalworld source verified.'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee /tmp/rawalworld-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Rawalworld APK compiler errors"
              echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              grep -nE '(^| )e: |error:|FAILURE:|Compilation error|Unresolved reference|Type mismatch|No value passed|Cannot find|Expecting ' /tmp/rawalworld-build.log || true
              echo
              tail -n 100 /tmp/rawalworld-build.log
            } > .github/last-build-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-build-error.txt
            git commit -m "Save latest Rawalworld build error" || true
            git push || true
            exit "$status"
          fi

      - name: Upload Rawalworld APK
        uses: actions/upload-artifact@v4
        with:
          name: Rawalworld-Final-APK
          path: app/build/outputs/apk/debug/app-debug.apk
